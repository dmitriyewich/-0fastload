name: Build Release Win32

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'

      - name: Build !0fastload.asi
        run: msbuild '.\!0fastload.vcxproj' /t:Build /p:Configuration=Release /p:Platform=Win32

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastload-release-win32
          path: build/Release/!0fastload.asi
          if-no-files-found: error
          retention-days: 30

  publish_release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastload-release-win32
          path: release

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mv -- 'release/!0fastload.asi' release/0fastload.asi
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" release/0fastload.asi
